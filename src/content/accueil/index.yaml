seo:
  titre: Conseil, formation en sécurité au travail · Bretagne Pays de Loire
  description: >-
    Formations SST, incendie et habilitations électriques, conseil en prévention
    et matériel de sécurité à La Baule et Saint-Nazaire. Organisme certifié
    Qualiopi.
  noindex: false
blocs:
  - discriminant: hero
    value:
      titre: Conseil, formation et matériel de Sécurité au Travail
      titreAccent: en Pays de la Loire et Bretagne
      texte: Anticiper aujourd'hui, protéger demain
      annotation: Anticiper aujourd'hui, protéger demain
      disposition: droite
      image: /src/assets/images/accueil/blocs/0/value/image.jpeg
      alt: >-
        Stagiaire manipulant un extincteur lors d’un exercice incendie encadré
        par des formateurs
      illustration: ''
      boutons:
        - libelle: Voir nos formations
          url: /formations/
          style: principal
          icone: formation
          fleche: true
        - libelle: Demander un devis matériel
          url: /contact/
          style: secondaire
          icone: devis
          fleche: true
  - discriminant: reassurance
    value:
      style: blanche
      items:
        - icone: qualite
          titre: Certifié Qualiopi
          texte: La qualité de nos formations est certifiée Qualiopi
        - icone: certification
          titre: Habilitation
          texte: Des formateurs sont habilités et expérimentés
        - icone: avis
          titre: 4,8/5 sur Google
          texte: Des entreprises nous font confiance
        - icone: localisation
          titre: Pays de la Loire et Bretagne
          texte: Une entreprise ancrée localement à Saint-Nazaire
  - discriminant: cartes
    value:
      titre: Une réponse complète à tous vos besoins de sécurité
      intro: 'Conseil, formation et matériel : trois expertises complémentaires.'
      alignement: centre
      style: cartes
      cartes:
        - image: /src/assets/images/accueil/blocs/2/value/cartes/0/image.jpeg
          alt: >-
            Consultant en gilet de sécurité échangeant avec une responsable sur
            une tablette
          icone: accompagnement
          titre: Être accompagné
          texte: >-
            Audit, Commission de Sécurité, DUERP, notices incendie… Nous vous
            conseillons pour mettre votre établissement en conformité.
          lien: /conseil/
          lienLibelle: Découvrir notre accompagnement
        - image: /src/assets/images/accueil/blocs/2/value/cartes/1/image.jpg
          alt: Stagiaires pratiquant un massage cardiaque sur un mannequin
          icone: formation
          titre: Se former
          texte: >-
            Formations incendie, SST, habilitations et plus encore, pour des
            équipes compétentes et réactives.
          lien: /formations/
          lienLibelle: Découvrir nos formations
        - image: /src/assets/images/accueil/blocs/2/value/cartes/2/image.jpg
          alt: Extincteurs, panneaux de signalisation et détecteurs de fumée
          icone: prevention
          titre: S’équiper
          texte: >-
            Extincteurs, signalétique, alarmes, équipements de sécurité… Du
            matériel professionnel, sélectionné pour vos besoins.
          lien: /materiel/
          lienLibelle: Découvrir notre matériel
  - discriminant: miseEnAvant
    value:
      etiquette: Nouveau
      titre: Du matériel de sécurité, avec la formation en plus !
      texte: >-
        Nous formons vos équipes à utiliser le matériel que nous vous
        fournissons. Un accompagnement complet, de l’achat à la prise en main
        sur le terrain.
      bouton:
        libelle: Demander un devis matériel
        url: /contact/
        style: principal
        icone: devis
        fleche: true
      produits:
        - image: /src/assets/images/accueil/blocs/3/value/produits/0/image.jpg
          alt: Extincteur rouge
          titre: Extincteurs
          texte: Vente, installation et maintenance
          lien: /materiel/
        - image: /src/assets/images/accueil/blocs/3/value/produits/1/image.jpg
          alt: Panneau vert de sortie de secours
          titre: Signalétique
          texte: Panneaux, plans d’évacuation, consignes, BAES
          lien: /materiel/
        - image: /src/assets/images/accueil/blocs/3/value/produits/2/image.jpg
          alt: Détecteur de fumée
          titre: Détection et alarme
          texte: Détecteurs, alarmes incendie...
          lien: /materiel/
        - image: /src/assets/images/accueil/blocs/3/value/produits/3/image.jpg
          alt: 'Défibrilateur, trousse de secours '
          titre: Équipements de sécurité
          texte: |
            EPI, trousses de secours, défibrillateur
          lien: /materiel/
  - discriminant: avisSessions
    value:
      titreAvis: Ils nous font confiance
      note: '5'
      nombreAvis: Plus de 35 avis sur Google
      lienAvis: https://share.google/6dfc0p04pdbhFp0sn
      avis:
        - citation: >-
            Formation SST très concrète et adaptée à notre activité. Formateur
            pédagogue et à l’écoute. Je recommande Prolipsi !
          auteur: Entreprise du secteur tertiaire
          icone: entreprise
        - citation: >-
            Un excellent accompagnement pour notre mise en conformité ERP. Des
            conseils clairs et un vrai suivi.
          auteur: Établissement recevant du public (ERP)
          icone: etablissement
        - citation: >-
            Exercice d’évacuation très bien préparé, nos équipes savent
            maintenant exactement quoi faire.
          auteur: Industrie, Saint-Nazaire
          icone: entreprise
      titreSessions: Prochaines sessions de formation
      nombreSessions: 4
      lienCalendrier:
        libelle: Voir tout le calendrier
        url: /calendrier/
  - discriminant: logos
    value:
      titre: Nos certifications
      texte: Des gages de qualité pour vous accompagner en toute confiance.
      logos:
        - image: /src/assets/images/accueil/blocs/5/value/logos/0/image.jpg
          nom: Qualiopi
        - image: /src/assets/images/accueil/blocs/5/value/logos/1/image.png
          nom: SST
        - image: /src/assets/images/accueil/blocs/5/value/logos/2/image.jpg
          nom: CNPP
  - discriminant: faq
    value:
      titre: Vos questions les plus fréquentes
      intro: |-
        Une question ?
        Nous avons la réponse !
      disposition: colonnes
      marqueur: plus
      premiereOuverte: false
      questions:
        - question: Le SST est-il obligatoire ?
          reponse: >-
            Le Code du travail impose à l’employeur d’organiser les premiers
            secours. La présence de sauveteurs secouristes du travail est
            obligatoire dans les ateliers où sont effectués des travaux
            dangereux et sur les chantiers employant au moins 20 personnes
            pendant plus de 15 jours. Dans les autres cas, elle est fortement
            recommandée.
        - question: Proposez-vous des formations en entreprise ?
          reponse: >-
            Oui. Nous intervenons directement dans vos locaux, en
            intra-entreprise, à La Baule, Guérande, Saint-Nazaire et dans toute
            la région, avec le matériel pédagogique nécessaire.
        - question: Vendez-vous des extincteurs aux entreprises ?
          reponse: >-
            Oui. Nous fournissons, installons et entretenons les extincteurs, et
            nous formons vos équipes à les utiliser.
        - question: Accompagnez-vous les ERP (établissements recevant du public) ?
          reponse: >-
            Oui. Nous préparons avec vous le passage de la commission de
            sécurité, les registres, les notices et les exercices d’évacuation.
  - discriminant: derniereActu
    value:
      titre: Nos actualités
      texte: Retrouvez nos conseils, nouveautés et événements.
  - discriminant: appel
    value:
      titre: Un besoin en sécurité ? Parlons-en.
      texte: Choisissez votre besoin, nous vous apportons une réponse adaptée.
      style: bandeau
      image: /src/assets/images/accueil/blocs/8/value/image.jpg
      pictos: []
      boutons:
        - libelle: Je veux me mettre en conformité
          url: /conseil/
          style: blanc
          icone: devis
          fleche: false
        - libelle: Je veux former mes équipes
          url: /formations/
          style: principal
          icone: formation
          fleche: false
        - libelle: Je veux m’équiper
          url: /materiel/
          style: blanc
          icone: materiel
          fleche: false
