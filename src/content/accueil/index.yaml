  - discriminant: faq
    value:
      titre: Vos questions les plus fréquentes
      intro: |-
        Une question ?
        Nous avons la réponse !
      disposition: colonnes
      questions:
        - question: Le SST est-il obligatoire ?
          reponse: Le Code du travail impose à l’employeur d’organiser les premiers secours. La présence de sauveteurs secouristes du travail est obligatoire dans les ateliers où sont effectués des travaux dangereux et sur les chantiers employant au moins 20 personnes pendant plus de 15 jours. Dans les autres cas, elle est fortement recommandée.
        - question: Proposez-vous des formations en entreprise ?
          reponse: Oui. Nous intervenons directement dans vos locaux à La Baule, Saint-Nazaire et dans toute la région, avec le matériel pédagogique nécessaire.
        - question: Vendez-vous des extincteurs aux entreprises ?
          reponse: Oui. Nous fournissons, installons et entretenons les extincteurs, et nous formons vos équipes à les utiliser.
        - question: Accompagnez-vous les ERP (établissements recevant du public) ?
          reponse: Oui. Nous préparons avec vous le passage de la commission de sécurité, les registres, les notices et les exercices d’évacuation.
  - discriminant: derniereActu
    value:
      titre: Nos actualités
      texte: Retrouvez nos conseils, nouveautés et événements.
  - discriminant: appel
    value:
      titre: Un besoin en sécurité ? Parlons-en.
      texte: Choisissez votre besoin, nous vous apportons une réponse adaptée.
