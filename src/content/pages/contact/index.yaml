    questions:
    - question: Intervenez-vous dans nos locaux ?
      reponse: Oui. Nous nous déplaçons à La Baule, Saint-Nazaire et en Loire-Atlantique.
    - question: Comment inscrire un salarié à une session inter-entreprises ?
      reponse: Consultez le calendrier des prochaines sessions, puis envoyez-nous votre demande en précisant la formation, la date souhaitée et le nombre de participants. Nous confirmons la place et vous transmettons la convocation.
    - question: Quelles adaptations en situation de handicap ?
      reponse: Signalez-nous toute situation de handicap dès votre demande. Nous étudions avec vous les adaptations possibles du lieu, du rythme et des supports.
