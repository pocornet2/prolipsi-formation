  - discriminant: faq
    value:
      titre: Vos questions sur nos formations
      intro: ''
      disposition: colonnes
      marqueur: chevron
      questions:
        - question: Quelle formation choisir pour mes salariés ?
          reponse: |-
            Tout dépend de votre activité, de vos risques et de vos obligations. Le SST est la base pour organiser les secours ; les formations incendie (premier témoin, équipier de première intervention, guide-file et serre-file) préparent à réagir face à un départ de feu ; l’habilitation électrique est nécessaire dès qu’un salarié intervient sur ou à proximité d’installations électriques.

            Décrivez-nous votre besoin : nous vous conseillons le parcours adapté.
        - question: Quand renouveler le SST ?
          reponse: Le certificat SST est valable 24 mois. Pour le conserver, le sauveteur secouriste suit un MAC SST (maintien et actualisation des compétences) de 7 heures avant l’échéance.
        - question: Comment organiser un exercice d’évacuation ?
          reponse: Nous préparons le scénario avec vous, animons l’exercice dans vos locaux, puis réalisons un débriefing et un compte rendu avec des pistes d’amélioration. Comptez une à deux heures selon la taille de l’établissement.
        - question: Quelle différence entre intra et inter ?
          reponse: En intra, la formation a lieu dans vos locaux, pour vos seuls salariés, avec un contenu adapté à vos équipements. En inter-entreprises, vos salariés rejoignent une session dans nos centres de La Baule ou Saint-Nazaire avec des stagiaires d’autres entreprises.
        - question: Ma formation peut-elle être financée ?
          reponse: Une prise en charge par votre OPCO peut être possible selon votre situation. Nous vous remettons les documents nécessaires à votre demande de financement.
        - question: Quelles adaptations en situation de handicap ?
          reponse: Signalez-nous toute situation de handicap dès votre demande. Nous étudions avec vous les adaptations possibles du lieu, du rythme et des supports.
