- discriminant: faq
  value:
    titre: Vos questions sur le matériel
    intro: ''
    disposition: colonnes
    marqueur: plus
    questions:
    - question: Quel matériel proposez-vous ?
      reponse: Extincteurs et matériel de sécurité incendie, défibrillateurs (DAE), trousses et armoires de premiers secours, signalétique de sécurité et plans d’évacuation. Nous vous orientons vers l’équipement adapté à vos locaux et à votre activité.
    - question: Puis-je commander en ligne ?
      reponse: 'Le matériel est proposé sur devis : décrivez-nous vos locaux et votre besoin via le formulaire, nous vous adressons une proposition adaptée.'
    - question: Formez-vous à l’utilisation du matériel ?
      reponse: 'Oui. Nous formons vos équipes à l’utilisation du matériel fourni : manipulation des extincteurs, défibrillateur, gestes de premiers secours, évacuation.'
    - question: Quels services sont disponibles selon le matériel ?
      reponse: 'Selon l’équipement : conseil sur le choix et l’implantation, fourniture, mise en place et formation de vos équipes. Précisez votre besoin dans votre demande, nous vous indiquons ce qui est possible pour votre établissement.'
    - question: À qui s’adresse votre offre ?
      reponse: Aux entreprises, commerces, établissements recevant du public, associations et collectivités de La Baule, Saint-Nazaire et de Loire-Atlantique.
    - question: Comment définir les besoins de mes locaux ?
      reponse: Le nombre et le type d’équipements dépendent de la surface, de l’activité, des risques et du type d’établissement. Nous pouvons étudier votre situation avec vous, et si besoin réaliser une visite dans le cadre de notre offre Conseil & prévention.
- discriminant: contact
  value:
    titre: Demander un devis matériel
    texte: Indiquez-nous vos locaux, les produits recherchés et les quantités souhaitées.
