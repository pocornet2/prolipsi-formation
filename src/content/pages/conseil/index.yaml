      titre: Vos questions sur le conseil et la prévention
      intro: ''
      disposition: colonnes
      marqueur: plus
      questions:
        - question: Qu’est-ce qu’une commission de sécurité incendie ?
          reponse: C’est la commission qui visite les établissements recevant du public (ERP) pour vérifier le respect des règles de sécurité incendie, avant l’ouverture puis périodiquement selon le type et la catégorie de l’établissement. Elle rend un avis au maire, qui autorise ou non l’ouverture ou la poursuite de l’exploitation.
        - question: Qui doit avoir un DUERP ?
          reponse: Tout employeur doit évaluer les risques professionnels et consigner les résultats dans le document unique d’évaluation des risques professionnels (DUERP), dès le premier salarié. Le document doit être tenu à jour, notamment lors de changements importants dans l’organisation ou les conditions de travail.
        - question: Quand faut-il une notice de sécurité incendie ?
          reponse: La notice de sécurité est jointe au dossier de demande de permis de construire ou d’autorisation de travaux d’un ERP. Elle décrit les dispositions prises pour la sécurité incendie de l’établissement. Nous vous aidons à la rédiger, avec la prise en compte de l’accessibilité.
        - question: Peut-on préparer la visite de la commission ?
          reponse: Oui. Nous réalisons un audit préalable, vérifions avec vous les documents et registres demandés, préparons les équipes et pouvons organiser une pré-visite qui simule le passage de la commission.
        - question: Le DUERP est-il un accompagnement ou une formation ?
          reponse: 'C’est un accompagnement : nous évaluons avec vous les risques de votre activité et construisons le document et le plan d’action. Il peut être complété par la formation de vos équipes (SST, incendie, gestes et postures…).'
        - question: Quel budget et quels délais prévoir ?
          reponse: Ils dépendent de la taille de l’établissement et de la prestation. Après un premier échange, nous vous adressons une proposition détaillée avec le calendrier d’intervention.
